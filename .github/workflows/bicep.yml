name: Network Bicep validation

on:
  push:
    paths:
      - "infrastructure/**"
      - ".github/workflows/bicep.yml"
  pull_request:
    paths:
      - "infrastructure/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build template
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infrastructure/main.bicep
